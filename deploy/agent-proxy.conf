# agent-proxy: Forgejo за nginx с инъекцией mod-bootstrap
# - Forgejo: 127.0.0.1:3000 (HTTP_PORT в app.ini)
# - agent-admin backend: 127.0.0.1:8091
# - инъекция: <script defer src="/__mods__/bootstrap.js"></script> в </body>
# - /__mods__/* → backend /agent-admin/* (bootstrap + ассеты модов, без auth)

worker_processes 2;
pid /run/nginx-agent.pid;

events { worker_connections 512; }

http {
    access_log /var/log/nginx-agent/access.log;
    error_log /var/log/nginx-agent/error.log warn;
    sendfile on;
    keepalive_timeout 65;
    proxy_http_version 1.1;
    client_max_body_size 1028m;
    client_body_temp_path /var/lib/nginx-agent/body 1 2;
    proxy_temp_path /var/lib/nginx-agent/proxy 1 2;

    upstream forgejo { server 127.0.0.1:3000; }
    upstream agent_admin { server 127.0.0.1:8091; }

    map $http_upgrade $agent_conn_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # --- API/ассеты mod-системы (без подмены) ---
        location /__mods__/ {
            proxy_pass http://agent_admin/agent-admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-store";
        }

        # --- backend панели «Агент» (API + мод-менеджер) ---
        location /agent-admin/ {
            access_log /var/log/agent-admin.access.log;
            proxy_pass http://agent_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- всё остальное: Forgejo + инъекция bootstrap для injection-модов
        #     (нативные template-моды не зависят от этого — они в custom/) ---
        location / {
            proxy_pass http://forgejo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $agent_conn_upgrade;
            # без gzip — иначе sub_filter не сработает
            proxy_set_header Accept-Encoding "";
            # webview (Hermes desktop) не шлёт Sec-Fetch-Site, а stateless-CSRF
            # (NewCrossOriginProtection, Forgejo PR9830) без него падает в
            # fallback Origin-vs-Host и режет любой POST на 403 "cross-origin".
            # Форсим same-origin: LAN, за логином, один пользователь.
            proxy_set_header Sec-Fetch-Site "same-origin";

            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter '</body>' '<script defer src="/__mods__/bootstrap.js"></script></body>';
        }
    }
}
